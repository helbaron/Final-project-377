<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Future Saver - Debt</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="app-container">
      <!-- HEADER -->
      <header class="top-header">
        <div class="brand">
          <div class="logo">⌬</div>
          <h1>Future <span>Saver</span></h1>
        </div>
        <p class="step-text">Step 3 of 5</p>
      </header>

      <!-- PROGRESS BAR -->
      <div class="top-progress">
        <div class="top-progress-fill" style="width: 60%"></div>
      </div>

      <!-- MAIN LAYOUT -->
      <main class="layout">
        <!-- SIDEBAR -->
        <aside class="sidebar">
          <p class="sidebar-title">Your Setup</p>

          <div class="step completed">
            <div class="step-number">✓</div>
            <div>
              <h3>You</h3>
              <p>Personal info</p>
            </div>
          </div>

          <div class="step completed">
            <div class="step-number">✓</div>
            <div>
              <h3>Goals</h3>
              <p>Savings goals</p>
            </div>
          </div>

          <div class="step active">
            <div class="step-number">3</div>
            <div>
              <h3>Debt</h3>
              <p>Debts & loans</p>
            </div>
          </div>

          <div class="step">
            <div class="step-number">4</div>
            <div>
              <h3>Invest</h3>
              <p>Investments</p>
            </div>
          </div>

          <div class="step">
            <div class="step-number">5</div>
            <div>
              <h3>Review</h3>
              <p>Confirm</p>
            </div>
          </div>

          <div class="sidebar-divider"></div>

          <p class="progress-label">Progress</p>
          <div class="small-progress">
            <div class="small-progress-fill" style="width: 60%"></div>
          </div>
          <p class="complete-text">3 of 5 complete</p>
        </aside>

        <!-- CONTENT -->
        <section class="content">
          <form class="setup-card" id="debtForm">
            <div class="icon-box">💳</div>

            <h2>Your Debts</h2>
            <p class="subtitle">
              Track what you owe to see your payoff progress
            </p>

            <!-- FIRST DEBT -->
            <div class="debt-box">
              <p class="debt-number">Debt 1</p>

              <div class="debt-row">
                <div>
                  <label>Type</label>
                  <select>
                    <option>💳 Credit Card</option>
                    <option>🎓 Student Loan</option>
                    <option>🚗 Auto Loan</option>
                    <option>🏠 Mortgage</option>
                  </select>
                </div>

                <div class="debt-name">
                  <label>Debt Name</label>
                  <input
                    class="debtName"
                    type="text"
                    placeholder="e.g. Student Loan"
                    required
                  />
                </div>
              </div>

              <div class="two-columns">
                <div>
                  <label>Current Balance</label>
                  <input
                    class="currentBalance"
                    type="number"
                    placeholder="5,000"
                    required
                  />
                </div>

                <div>
                  <label>Original Amount</label>
                  <input
                    class="originalAmount"
                    type="number"
                    placeholder="10,000"
                    required
                  />
                </div>
              </div>

              <div class="two-columns">
                <div>
                  <label>Interest Rate (APR)</label>
                  <input
                    class="interestRate"
                    type="number"
                    step="0.1"
                    placeholder="4.5"
                    required
                  />
                </div>

                <div>
                  <label>Monthly Payment</label>
                  <input
                    class="monthlyPayment"
                    type="number"
                    placeholder="200"
                    required
                  />
                </div>
              </div>
            </div>

            <!-- ADD MORE -->
            <button type="button" class="add-debt">+ Add another debt</button>

            <!-- NAV BUTTONS -->
            <div class="button-row">
              <button
                type="button"
                class="back-btn"
                onclick="window.location.href = 'goals.html'"
              >
                ← Back
              </button>

              <button type="submit">Continue →</button>
            </div>
          </form>
        </section>
      </main>
    </div>

    <script src="debt.js"></script>
  </body>
</html>
